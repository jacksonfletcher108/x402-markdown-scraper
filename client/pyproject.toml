[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x402-scraper"
version = "0.5.1"
description = "httpx client for the x402 Markdown Scraper shop. Handles HTTP 402 Exact USDC on Base."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "x402 Markdown Scraper" }]
keywords = ["x402", "usdc", "base", "scraper", "agents", "mcp"]
dependencies = [
    "httpx>=0.27.0",
    "x402[evm]>=2.0.0",
    "eth-account>=0.13.0",
]

[project.urls]
Homepage = "https://x402-markdown-scraper.onrender.com"
Documentation = "https://x402-markdown-scraper.onrender.com/docs"
Source = "https://github.com/jacksonfletcher108/x402-markdown-scraper"

[project.optional-dependencies]
examples = ["langchain-core>=0.3.0", "llama-index-core>=0.12.0"]

[tool.setuptools.packages.find]
where = ["src"]
